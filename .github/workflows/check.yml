name: Check and build Decky plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npx --yes pnpm@9.15.9 install --frozen-lockfile
      - run: pip install -r requirements-dev.txt
      - run: npx --yes pnpm@9.15.9 typecheck
      - run: npx --yes pnpm@9.15.9 test
      - run: npx --yes pnpm@9.15.9 build
      - run: python -m unittest discover -s tests -v
      - run: npx --yes pnpm@9.15.9 exec playwright install --with-deps chromium
      - run: npx --yes pnpm@9.15.9 test:browser
        env:
          PYTHON: python
      - run: python scripts/build_release.py --output-dir out
      - uses: actions/upload-artifact@v4
        with:
          name: SteamBooster-Decky
          path: out/*
